[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "levinverse-corpus"
version = "0.1.0"
description = "Incremental public-source catalog for Michael Levin's spoken work"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
collector = ["yt-dlp>=2024.1.1", "beautifulsoup4>=4.12", "pypdf>=5.0"]
whisper = ["faster-whisper>=1.2.1,<1.3", "av>=11,<19"]
cuda-windows = ["nvidia-cublas-cu12>=12.8; platform_system == 'Windows'", "nvidia-cudnn-cu12>=9; platform_system == 'Windows'"]

[project.scripts]
levinverse = "levinverse.cli:main"

[tool.setuptools.packages.find]
where = ["pipelines"]
