[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "levinverse-corpus"
version = "0.1.0"
description = "Incremental public-source catalog for Michael Levin's spoken work"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
collector = ["yt-dlp>=2024.1.1"]
whisper = ["faster-whisper>=1.0"]

[project.scripts]
levinverse = "levinverse.cli:main"

[tool.setuptools.packages.find]
where = ["pipelines"]
